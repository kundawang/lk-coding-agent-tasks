<h1>部署手册</h1>

<h2>准备</h2>
<ul>
  <li>确认配置</li>
  <li>备份数据库
    <ul>
      <li>全量备份</li>
      <li>增量备份</li>
    </ul>
  </li>
  <li>通知相关同学</li>
</ul>

</ol>
<pre><code class="language-bash">#!/bin/bash
set -e

echo "deploying..."
npm run build</code></pre>
